name: V62 - Menu primer subitem y costo OC
on:
  push:
    branches: [fix/v62-menu-primer-subitem-costo-oc-20261123]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Chromium para pruebas funcionales
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Lint y nuevas pruebas V62
        run: |
          set -euo pipefail
          node --check assets/js/app-produccion.js
          node --check assets/js/ordenes-compra-v55.js
          node --check assets/js/catalogos-api.js
          node tests/menu-primer-subitem-v62.cjs
          node tests/costo-producto-oc-v62.cjs
      - name: Regresiones Compras V55-V61, Clientes y navegacion
        run: |
          set -euo pipefail
          node tests/aceptacion-v54-inicio.cjs
          node tests/reenvio-oc-v61.cjs
          node tests/oc-totales-pdf-v59.cjs
          node tests/boton-nueva-oc-v58.cjs
          node tests/dialogos-compras-v57.cjs
          node tests/selectores-interfaz-v56.cjs
          node tests/ordenes-compra-v55.cjs
          node tests/cache-continuidad-v55.cjs
          node tests/clientes-v50.cjs
          node tests/paginadores-codigos-v52.cjs
