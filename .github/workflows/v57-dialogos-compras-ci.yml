name: V57 - Dialogos Compras y buscador proveedores
on:
  push:
    branches: [fix/v57-oc-proveedor-dialogos-20261123]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Prueba con estilos productivos
        run: |
          set -euo pipefail
          node --check assets/js/ordenes-compra-v55.js
          node --check tests/dialogos-compras-v57.cjs
          node tests/dialogos-compras-v57.cjs
      - name: Mantener pruebas de V56, V55 y Clientes
        run: |
          set -euo pipefail
          node tests/selectores-interfaz-v56.cjs
          node tests/ordenes-compra-v55.cjs
          node tests/cache-continuidad-v55.cjs
          node tests/clientes-v50.cjs
          node tests/paginadores-codigos-v52.cjs
