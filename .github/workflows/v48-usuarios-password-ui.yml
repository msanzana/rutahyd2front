name: V48 - interfaz alta de usuarios con contraseña inicial
on:
  push:
    branches: [hotfix/v48-password-usuarios-20261122]
    paths:
      - assets/js/usuarios.js
      - assets/css/crud-v18.css
      - index.html
      - tests/usuarios-password-v48.cjs
      - .github/workflows/v48-usuarios-password-ui.yml
permissions:
  contents: read
jobs:
  usuarios:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxis y referencias del frontend
        run: |
          set -euo pipefail
          node --check assets/js/usuarios.js
          node --check tests/usuarios-password-v48.cjs
          grep -Fq 'usuarios.js?v=20261122-v48prod' index.html
          grep -Fq 'crud-v18.css?v=20261122-v48prod' index.html
      - name: Probar creación, confirmación e invitación con Chromium
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node tests/usuarios-password-v48.cjs
          echo 'V48 usuarios: contraseña inicial, confirmación e invitación verificadas sin producción.' >> "$GITHUB_STEP_SUMMARY"
