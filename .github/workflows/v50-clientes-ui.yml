name: V50 - Clientes listado CRUD telefono y filtros avanzados
on:
  push:
    branches: [feature/v50-clientes-listado-20261122]
    paths:
      - .github/workflows/v50-clientes-ui.yml
      - assets/js/modulos-oficiales.js
      - assets/js/app-produccion.js
      - assets/js/catalogos-api.js
      - assets/css/clientes-v50.css
      - index.html
      - tests/clientes-v50.cjs
permissions:
  contents: read
jobs:
  clientes-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS valido, subitem y versiones
        run: |
          set -euo pipefail
          node --check assets/js/modulos-oficiales.js
          node --check assets/js/app-produccion.js
          node --check assets/js/catalogos-api.js
          node --check tests/clientes-v50.cjs
          grep -Fq 'data-nav="clientes_listado"' index.html
          grep -Fq 'clientes-v50.css?v=20261122-v50' index.html
          grep -Fq 'modulos-oficiales.js?v=20261122-v50' index.html
          grep -Fq 'catalogos-api.js?v=20261122-v50' index.html
          grep -Fq 'app-produccion.js?v=20261122-v50' index.html
      - name: Chromium real con API en memoria
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node tests/clientes-v50.cjs
          echo 'V50 UI: columnas, subitem, iconos, 2 paginadores, filtro servidor, CRUD y +56 exacto. Sin API productiva.' >> "$GITHUB_STEP_SUMMARY"
