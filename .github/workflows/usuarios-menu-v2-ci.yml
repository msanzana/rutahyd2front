name: Verificar usuarios, recuperación y menú sin producción
on:
  push:
    branches: [feature/usuarios-recuperacion-menu-20261121]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis JS y composición de menú
        run: |
          node --check assets/js/accesos.js
          node --check assets/js/app-produccion.js
          node --check assets/js/login-produccion.js
          node --check assets/js/proveedores-productos.js
          node --check assets/js/ubicaciones.js
          node --check assets/js/modulos-oficiales.js
          node --check assets/js/catalogos-api.js
          node --check assets/js/admin-remoto.js
          node --check assets/js/productos-remotos.js
          node --check assets/js/usuarios.js
          node --check assets/js/recuperacion.js
          test "$(grep -o 'data-admin-catalog=' index.html | wc -l)" -eq 4
          test "$(grep -o 'data-catalog-key=' index.html | wc -l)" -eq 6
          test -s assets/css/proveedores-ubicaciones-v38.css
          grep -Fq 'id="ubicacionesSubnav"' index.html
          grep -Fq 'id="navUsuarios"' index.html
          grep -Fq 'id="providerSubnav"' index.html
          ! grep -Fq 'id="loginDemo"' index.html
      - name: Instalar Chromium para pruebas aisladas
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Pruebas automáticas sin credenciales reales
        run: npx playwright test tests/produccion-sin-demo.spec.mjs tests/productos-proveedores-codigos-v2.spec.mjs tests/ubicaciones-proveedores-v38.spec.mjs
