name: Integracion real frontend Laravel MySQL aislado
on:
  push:
    branches: [feature/catalogos-api-adapter-v2-20261120]
    paths:
      - 'tests/real-mysql-e2e.spec.mjs'
      - '.github/workflows/real-mysql-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  e2e-mysql:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci_ephemeral_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_ephemeral_only --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Traer backend de prueba de forma independiente
        run: |
          git clone -q --depth 1 --branch feature/catalogos-api-productos-v2-20261120 https://github.com/msanzana/rutahyd2.git /tmp/backend_e2e
          test -f /tmp/backend_e2e/tests/integracion_catalogos_api.php
      - name: Preparar solamente base temporal (nunca InfinityFree)
        run: |
          mysql -h 127.0.0.1 -uroot -pci_ephemeral_only < /tmp/backend_e2e/database/espanol/01_esquema_completo_34_tablas_es.sql
          mysql -h 127.0.0.1 -uroot -pci_ephemeral_only < /tmp/backend_e2e/database/espanol/05_semillas_es.sql
          for i in 12_tokens_acceso_opcional.sql 13_catalogos_comerciales_aditivos.sql 14_productos_clasificacion_campos.sql 16_permisos_modulos_producto.sql; do
            mysql -h 127.0.0.1 -uroot -pci_ephemeral_only rutahyd2_es_local < "/tmp/backend_e2e/database/espanol/$i"
          done
      - name: Composer y usuarios de prueba descartables
        working-directory: /tmp/backend_e2e
        env:
          APP_NAME: RutaHD2_CI
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          APP_URL: 'http://127.0.0.1:8000'
          DB_CONNECTION: mysql
          DB_HOST: '127.0.0.1'
          DB_PORT: '3306'
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: ci_ephemeral_only
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          FRONTEND_ORIGIN: 'http://127.0.0.1:4173'
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php tests/integracion_catalogos_api.php
      - name: Iniciar Laravel HTTP local con base efímera
        working-directory: /tmp/backend_e2e
        env:
          APP_NAME: RutaHD2_CI
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          APP_URL: 'http://127.0.0.1:8000'
          DB_CONNECTION: mysql
          DB_HOST: '127.0.0.1'
          DB_PORT: '3306'
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: ci_ephemeral_only
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          FRONTEND_ORIGIN: 'http://127.0.0.1:4173'
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 >/tmp/rutahd-e2e-php.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/api/estado >/tmp/estado_api.json; then
              break
            fi
            sleep 1
          done
          grep -Fq 'disponible' /tmp/estado_api.json
      - name: Ejecutar navegador frente a API y MySQL REALES de CI
        env:
          CI: 'true'
          RUN_REAL_MYSQL_E2E: '1'
          CI_REAL_API_URL: 'http://127.0.0.1:8000'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test tests/real-mysql-e2e.spec.mjs --workers=1
      - name: Resumen sin datos ni contraseñas
        if: success()
        run: |
          echo "OK: navegador real → Laravel HTTP → MySQL efímero, 401/403, diez módulos, roles y padres de menú."
          echo "No se conectó a InfinityFree, no se desplegó PHP ni se modificó información productiva."
