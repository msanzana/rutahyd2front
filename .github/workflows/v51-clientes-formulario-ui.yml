name: V51 - Clientes formulario identidad, geografía y precios
on:
  push:
    branches: [hotfix/v51-clientes-formulario-precios-20261123]
    paths:
      - .github/workflows/v51-clientes-formulario-ui.yml
      - tests/clientes-v50.cjs
      - assets/js/modulos-oficiales.js
      - assets/js/app-produccion.js
      - assets/js/catalogos-api.js
      - assets/css/clientes-v50.css
      - index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clientes-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sintaxis y contrato visual
        run: |
          set -euo pipefail
          node --check assets/js/app-produccion.js
          node --check assets/js/modulos-oficiales.js
          node --check assets/js/catalogos-api.js
          node --check tests/clientes-v50.cjs
          grep -Fq 'data-nav="clientes_listado"' index.html
          ! grep -Fq 'customerCityPicker' assets/js/modulos-oficiales.js
          grep -Fq 'hd-customer-identity-row' assets/js/modulos-oficiales.js
          grep -Fq 'LISTA BASE asignada por defecto' assets/js/modulos-oficiales.js
          grep -Fq 'mountSelector(group,row?.ciudad_id' assets/js/modulos-oficiales.js
          grep -Fq 'clientes-v50.css?v=20261123-v51' index.html
          grep -Fq 'modulos-oficiales.js?v=20261123-v51' index.html
          grep -Fq "&#" assets/js/modulos-oficiales.js || true
      - name: Prueba Chromium sin acceder a producción
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node tests/clientes-v50.cjs
          echo 'V51: geografía cascada, identidad alineada, LISTA BASE y especial en alta, teléfono +56; API aislada.' >> "$GITHUB_STEP_SUMMARY"
