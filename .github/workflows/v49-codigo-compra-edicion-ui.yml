name: V49 - Código compra editable tras validación EAN
on:
  push:
    branches: [hotfix/v49-codigo-compra-edicion-20261122]
    paths:
      - assets/js/proveedores-productos.js
      - assets/css/interfaz-mix-validacion-v45.css
      - index.html
      - tests/codigos-compra-v49.cjs
      - .github/workflows/v49-codigo-compra-edicion-ui.yml
permissions:
  contents: read
jobs:
  codigo-compra:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Comprobar sintaxis y versiones V49
        run: |
          set -euo pipefail
          node --check assets/js/proveedores-productos.js
          node --check tests/codigos-compra-v49.cjs
          grep -Fq 'proveedores-productos.js?v=20261122-v49prod' index.html
          grep -Fq 'interfaz-mix-validacion-v45.css?v=20261122-v49prod' index.html
          grep -Fq "code.readOnly=false;code.disabled=false;" assets/js/proveedores-productos.js
          grep -Fq "Usar Code 128 para este código" assets/js/proveedores-productos.js
      - name: Ejecutar Chromium con formulario real y API aislada
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node tests/codigos-compra-v49.cjs
          node tests/codigos-compra-v47.cjs
          echo 'V49: edición tras rechazo, Code128 explícito, ceros iniciales y móvil verificados sin producción.' >> "$GITHUB_STEP_SUMMARY"
