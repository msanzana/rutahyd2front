name: V40 - pruebas de selector multiple y mix proveedor (sin deploy)
on:
  push:
    branches: [feature/v40-mix-proveedor-seleccion-multiple-20261122]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript, CSS y entrada de recursos
        run: |
          set -euo pipefail
          node --check assets/js/proveedores-productos.js
          node --check assets/js/catalogos-api.js
          node --check assets/js/buscador-productos-v39.js
          test -s assets/css/mix-proveedores-v40.css
          grep -Fq 'mix-proveedores-v40.css?v=20261122-v40' index.html
          grep -Fq 'proveedores-productos.js?v=20261122-v40' index.html
          grep -Fq 'catalogos-api.js?v=20261122-v40' index.html
      - name: Preparar Playwright en entorno aislado
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Testear regresiones, buscador multi y lote con API simulada
        run: |
          npx playwright test \
            tests/productos-proveedores-codigos-v2.spec.mjs \
            tests/proveedores-giro-rut-buscador-v39.spec.mjs \
            tests/ubicaciones-proveedores-v38.spec.mjs \
            tests/produccion-sin-demo.spec.mjs
