name: Comprobar frontend violeta con Chromium
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright Chromium sin proveedor externo
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verificar colores, navegación y adaptabilidad
        run: npm test
      - name: Guardar capturas y reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rutahyd2-violeta-previsualizacion
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
