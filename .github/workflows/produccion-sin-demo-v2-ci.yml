name: Validar aplicación definitiva sin demostración
on:
  push:
    branches: [main, feature/produccion-sin-demo-login-v2-20261121, feature/integracion-codigos-proveedores-release-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar scripts y aislamiento local
        run: |
          for f in assets/js/*.js; do node --check "$f"; done
          node --check tests/produccion-sin-demo.spec.mjs
          node --check tests/crud-entidades-comerciales.spec.mjs
          node --check tests/producto-modal-hotfix.spec.mjs
          node --check tests/productos-proveedores-codigos-v2.spec.mjs
          node --check tests/crud-estilo-v18.spec.mjs
          node --check tests/catalogos-menu-regresion-v19.spec.mjs
          node --check tests/ui-v20-listados-perfil.spec.mjs
          node --check tests/filtros-productos-validacion-v22.spec.mjs
          node --check tests/listas-precios-flujo-integral-v25.spec.mjs
          node --check tests/login-foto-v26.spec.mjs
          node --check tests/productos-galeria-orden-guardado-v28.spec.mjs
          node --check assets/js/galeria-productos.js
          node --check assets/js/productos-remotos.js
          grep -Fq 'galeria-productos.js?v=20261122-photos28' index.html
          grep -Fq 'productos-densidad-v28.css?v=20261122-save29' index.html
          grep -Fq 'productos-remotos.js?v=20261122-margin30' index.html
          grep -Fq 'login-foto-v26.css?v=20261122-login26' index.html
          grep -Fq 'data:image/webp;base64,' assets/css/login-foto-v26.css
          grep -Fq 'app-produccion.js' index.html
          grep -Fq 'login-produccion.js' index.html
          grep -Fq 'produccion.css' index.html
          ! grep -Fq 'assets/js/catalogos.js" defer' index.html
          ! grep -Fq 'assets/js/app.js" defer' index.html
          ! grep -Fq 'Explorar interfaz de demostración' index.html
          ! grep -Fq 'loginDemo' index.html
          ! grep -Fq 'localStorage.' assets/js/app-produccion.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('index.html').read_text('utf-8')
          srcs=re.findall(r'<script[^>]*src="([^"]+)"',html)
          assert any('app-produccion.js' in x for x in srcs)
          assert any('login-produccion.js' in x for x in srcs)
          assert not any(re.search(r'/(app|catalogos)\.js(?:[?]|$)',x) for x in srcs),srcs
          assert 'id="loginDemo"' not in html
          assert 'Explorar interfaz de demostración' not in html
          navigation=html.split('<nav class="nav"',1)[1].split('</nav>',1)[0]
          official=['administracion','compras','ventas','proveedores','clientes','productos','bodega','cuentas_corrientes']
          indices=[navigation.index('data-nav="'+key+'" class="nav-link') for key in official]
          assert indices==sorted(indices)
          assert navigation.count('class="nav-link"')==8
          print('Política de producción: login JWT, ocho módulos oficiales, sin scripts demo.')
          PY
      - name: Instalar Playwright Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Pruebas de producción con API simulada y sin credenciales reales
        run: npx playwright test tests/produccion-sin-demo.spec.mjs tests/crud-entidades-comerciales.spec.mjs tests/producto-modal-hotfix.spec.mjs tests/productos-proveedores-codigos-v2.spec.mjs tests/crud-estilo-v18.spec.mjs tests/catalogos-menu-regresion-v19.spec.mjs tests/ui-v20-listados-perfil.spec.mjs tests/filtros-productos-validacion-v22.spec.mjs tests/listas-precios-flujo-integral-v25.spec.mjs tests/login-foto-v26.spec.mjs tests/productos-galeria-orden-guardado-v28.spec.mjs
      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-produccion
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
