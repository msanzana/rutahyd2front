name: V46 - confirmar checkbox cuadrado contra switch global
on:
  push:
    branches: [hotfix/v46-checkbox-selector-20261122]
permissions:
  contents: read
jobs:
  checkbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar scripts y versión de caché
        run: |
          set -euo pipefail
          node --check assets/js/buscador-productos-v39.js
          node --check tests/interfaz-v45.cjs
          grep -Fq 'buscador-productos-v39.js?v=20261122-v46prod' index.html
          grep -Fq 'interfaz-mix-validacion-v45.css?v=20261122-v46prod' index.html
          grep -Fq "no-switch hd-lookup-check" assets/js/buscador-productos-v39.js
          grep -Fq '.hd-lookup-check:checked + .hd-lookup-box' assets/css/interfaz-mix-validacion-v45.css
      - name: "Chromium: comprobar geometría, marca SVG, teclado y selección múltiple"
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node tests/interfaz-v45.cjs
          echo 'V46: checkbox 25x25 con SVG, sin perilla switch V32, selección por mouse y Space.' >> "$GITHUB_STEP_SUMMARY"
      - name: Conservar capturas de estado normal y marcado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v46-checkbox-capturas
          path: v46-checkbox-*.png
          retention-days: 14
          if-no-files-found: ignore
